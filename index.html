/* Backend-Anbindung (Supabase)                                       */
/* ------------------------------------------------------------------ */
// Trage hier die Zugangsdaten aus deinem eigenen kostenlosen Supabase-Projekt
// ein (Project Settings -> API -> "Project URL" und "anon public" Key).
// Ohne diese Angaben läuft die App automatisch im lokalen Modus (Daten
// bleiben nur im Browser des jeweiligen Geräts erhalten).
const SUPABASE_URL = ""; // z.B. "https://xxxxxxxxxxxx.supabase.co"
const SUPABASE_ANON_KEY = ""; // der "anon public" Key aus deinem Projekt

const BACKEND_ENABLED = Boolean(SUPABASE_URL && SUPABASE_ANON_KEY);
const STATE_ROW_ID = "main";

async function loadRemoteState() {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/app_data?id=eq.${STATE_ROW_ID}&select=data`, {
    headers: {
      apikey: SUPABASE_ANON_KEY,
      Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
    },
  });
  if (!res.ok) throw new Error("Laden fehlgeschlagen");
  const rows = await res.json();
  return rows.length > 0 ? rows[0].data : null;
}

async function saveRemoteState(state) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/app_data`, {
    method: "POST",
    headers: {
      apikey: SUPABASE_ANON_KEY,
      Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
      "Content-Type": "application/json",
      Prefer: "resolution=merge-duplicates",
    },
    body: JSON.stringify([{ id: STATE_ROW_ID, data: state, updated_at: new Date().toISOString() }]),
  });
  if (!res.ok) throw new Error("Speichern fehlgeschlagen");
}

function CheckoutForm({ ipads, setIpads, addActivity, jumpToInventory }) {
  const [ipadId, setIpadId] = useState("");
  const [holder, setHolder] = useState("");
  const [customHolder, setCustomHolder] = useState(false);
  const [group, setGroup] = useState("");
  const [returnDate, setReturnDate] = useState("");
  const [signed, setSigned] = useState(false);
  const [done, setDone] = useState("");

  const availableIpads = ipads.filter((i) => i.status === "available");
  const selected = ipads.find((i) => i.id === ipadId);

  function submit(e) {
    e.preventDefault();
    if (!selected || selected.status !== "available" || !holder) return;
    setIpads((prev) =>
      prev.map((i) =>
        i.id === ipadId
          ? { ...i, status: "lent", holder, class: group || "—", returnDate: returnDate || "—", condition: i.condition }
          : i
      )
    );
    addActivity("checkout", `${ipadId} an ${holder}${group ? ` (${group})` : ""} verliehen`);
    setDone(`${ipadId} wurde erfolgreich an ${holder} ausgegeben.`);
    setIpadId("");
    setHolder("");
    setGroup("");
    setReturnDate("");
    setSigned(false);
    setTimeout(() => setDone(""), 4000);
  }

  return (
    <form onSubmit={submit} className="space-y-5">
      {done && (
        <div className="rounded-xl bg-emerald-50 ring-1 ring-emerald-200 text-emerald-800 px-4 py-3 text-sm flex items-center gap-2">
          <CheckCircle2 size={18} /> {done}
        </div>
      )}

      <div>
        <label className="block text-sm font-semibold text-slate-700 mb-1.5">iPad-ID / QR-Code</label>
        <div className="relative">
          <QrCode size={18} className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" />
          <input
            list="available-ipads"
            value={ipadId}
            onChange={(e) => setIpadId(e.target.value)}
            placeholder="z.B. iPad-004 oder scannen"
            className="w-full rounded-xl border border-slate-300 pl-10 pr-4 py-3 text-base focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
          />
          <datalist id="available-ipads">
            {availableIpads.map((i) => (
              <option key={i.id} value={i.id} />
            ))}
          </datalist>
        </div>
        {ipadId && !selected && <p className="text-xs text-rose-600 mt-1.5">iPad nicht gefunden.</p>}
        {selected && selected.status !== "available" && (
          <p className="text-xs text-rose-600 mt-1.5">Dieses iPad ist aktuell nicht verfügbar ({STATUS_STYLE[selected.status].label}).</p>
        )}
        {selected && selected.status === "available" && (
          <p className="text-xs text-emerald-600 mt-1.5 flex items-center gap-1">
            <CheckCircle2 size={14} /> Verfügbar · Zustand: {selected.condition}
          </p>
        )}
      </div>

      <div>
        <label className="block text-sm font-semibold text-slate-700 mb-1.5">Ausgegeben an</label>
        {!customHolder ? (
          <select
            value={holder}
            onChange={(e) => {
              if (e.target.value === "__other__") {
                setCustomHolder(true);
                setHolder("");
              } else {
                const u = USERS.find((u) => u.name === e.target.value);
                setHolder(e.target.value);
                setGroup(u ? u.group : "");
              }
            }}
            className="w-full rounded-xl border border-slate-300 px-4 py-3 text-base focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 bg-white"
          >
            <option value="">Person auswählen…</option>
            {USERS.map((u) => (
              <option key={u.name} value={u.name}>
                {u.name} ({u.group})
              </option>
            ))}
            <option value="__other__">Andere Person eingeben…</option>
          </select>
        ) : (
          <div className="grid grid-cols-2 gap-3">
            <input
              autoFocus
              value={holder}
              onChange={(e) => setHolder(e.target.value)}
              placeholder="Name"
              className="rounded-xl border border-slate-300 px-4 py-3 text-base focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
            />
            <input
              value={group}
              onChange={(e) => setGroup(e.target.value)}
              placeholder="Klasse / Rolle"
              className="rounded-xl border border-slate-300 px-4 py-3 text-base focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
            />
          </div>
        )}
      </div>

      <div>
        <label className="block text-sm font-semibold text-slate-700 mb-1.5">Rückgabedatum (optional)</label>
        <input
          type="date"
          value={returnDate}
          onChange={(e) => setReturnDate(e.target.value)}
          className="w-full rounded-xl border border-slate-300 px-4 py-3 text-base focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
        />
      </div>

      <button
        type="button"
        onClick={() => setSigned((s) => !s)}
        className={`w-full flex items-center justify-between rounded-xl border px-4 py-3.5 transition-colors ${
          signed ? "bg-emerald-50 border-emerald-300" : "bg-slate-50 border-slate-200"
        }`}
      >
        <span className="flex items-center gap-2 text-sm font-medium text-slate-700">
          <PenLine size={17} /> Unterschrift erhalten
        </span>
        <span
          className={`h-6 w-11 rounded-full relative transition-colors ${signed ? "bg-emerald-500" : "bg-slate-300"}`}
        >
          <span
            className={`absolute top-0.5 h-5 w-5 rounded-full bg-white shadow transition-transform ${
              signed ? "translate-x-5" : "translate-x-0.5"
            }`}
          />
        </span>
      </button>

      <button
        type="submit"
        disabled={!selected || selected.status !== "available" || !holder}
        className="w-full rounded-xl bg-indigo-600 disabled:bg-slate-300 disabled:cursor-not-allowed hover:bg-indigo-700 text-white font-semibold py-3.5 transition-colors"
      >
        iPad ausgeben
      </button>
    </form>
  );
}

function CheckinForm({ ipads, setIpads, addActivity }) {
  const [ipadId, setIpadId] = useState("");
  const [notes, setNotes] = useState("");
  const [done, setDone] = useState("");

  const lentIpads = ipads.filter((i) => i.status === "lent");
  const selected = ipads.find((i) => i.id === ipadId);

  function submit(e) {
    e.preventDefault();
    if (!selected || selected.status !== "lent") return;
    setIpads((prev) =>
      prev.map((i) =>
        i.id === ipadId
          ? { ...i, status: "available", holder: null, class: null, returnDate: null, condition: notes || i.condition }
          : i
      )
    );
    addActivity("checkin", `${ipadId} zurückgenommen${notes ? ` · Zustand: ${notes}` : ""}`);
    setDone(`${ipadId} wurde ins Lager zurückgebucht.`);
    setIpadId("");
    setNotes("");
    setTimeout(() => setDone(""), 4000);
  }

  return (
    <form onSubmit={submit} className="space-y-5">
      {done && (
        <div className="rounded-xl bg-emerald-50 ring-1 ring-emerald-200 text-emerald-800 px-4 py-3 text-sm flex items-center gap-2">
          <CheckCircle2 size={18} /> {done}
        </div>
      )}

      <div>
        <label className="block text-sm font-semibold text-slate-700 mb-1.5">iPad-ID / QR-Code</label>
        <div className="relative">
          <Search size={18} className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" />
          <input
            list="lent-ipads"
            value={ipadId}
            onChange={(e) => setIpadId(e.target.value)}
            placeholder="z.B. iPad-002 oder scannen"
            className="w-full rounded-xl border border-slate-300 pl-10 pr-4 py-3 text-base focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500"
          />
          <datalist id="lent-ipads">
            {lentIpads.map((i) => (
              <option key={i.id} value={i.id} />
            ))}
          </datalist>
        </div>
      </div>

      {selected && selected.status === "lent" && (
        <div className="rounded-xl bg-slate-50 ring-1 ring-slate-200 px-4 py-3 text-sm">
          <p className="text-slate-700">
            Aktuell bei <span className="font-semibold">{selected.holder}</span> ({selected.class})
          </p>
          <p className="text-slate-500 mt-0.5">Erwartete Rückgabe: {selected.returnDate}</p>
        </div>
      )}
      {ipadId && !(selected && selected.status === "lent") && (
        <p className="text-xs text-rose-600 -mt-2">Dieses iPad ist nicht als verliehen registriert.</p>
      )}

      <div>
        <label className="block text-sm font-semibold text-slate-700 mb-1.5">Zustandsnotiz (optional)</label>
        <textarea
          value={notes}
          onChange={(e) => setNotes(e.target.value)}
          placeholder="z.B. Kratzer am Gehäuse, Display in Ordnung…"
          rows={3}
          className="w-full rounded-xl border border-slate-300 px-4 py-3 text-base focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 resize-none"
        />
      </div>

const STATUS_ALIASES = {
  available: "available",
  verfügbar: "available",
  verfuegbar: "available",
  frei: "available",
  lent: "lent",
  verliehen: "lent",
  ausgeliehen: "lent",
  repair: "repair",
  reparatur: "repair",
  "in reparatur": "repair",
  defekt: "repair",
};

function normalizeHeaderKey(key) {
  return String(key || "").trim().toLowerCase().replace(/[\s_-]+/g, " ");
}

const HEADER_MAP = {
  id: ["ipad-id", "ipad id", "id", "gerät", "geraet"],
  assetTag: ["asset-tag", "asset tag", "seriennummer", "sn"],
  status: ["status"],
  holder: ["inhaber", "holder", "ausgegeben an", "person"],
  group: ["klasse", "class", "rolle", "gruppe"],
  returnDate: ["rückgabedatum", "rueckgabedatum", "rückgabe", "return date"],
  condition: ["zustand", "condition", "notiz"],
};

function mapRow(rawRow) {
  const normalized = {};
  for (const [rawKey, value] of Object.entries(rawRow)) {
    normalized[normalizeHeaderKey(rawKey)] = String(value ?? "").trim();
  }
  const out = {};
  for (const [field, aliases] of Object.entries(HEADER_MAP)) {
    const foundKey = aliases.find((a) => normalized[a] !== undefined);
    out[field] = foundKey ? normalized[foundKey] : "";
  }
  return out;
}

function buildPreviewRows(rawRows, existingIpads) {
  const seenIds = new Set();
  return rawRows.map((rawRow, idx) => {
    const row = mapRow(rawRow);
    const issues = [];

    if (!row.id) issues.push("iPad-ID fehlt");

    const dupInFile = row.id && seenIds.has(row.id.toLowerCase());
    if (dupInFile) issues.push("Doppelt in Datei");
    if (row.id) seenIds.add(row.id.toLowerCase());

    const existing = row.id ? existingIpads.find((i) => i.id.toLowerCase() === row.id.toLowerCase()) : null;

    let status = STATUS_ALIASES[row.status.toLowerCase()] || "";
    if (!status) status = row.holder ? "lent" : "available";

    const state = issues.length > 0 ? "error" : existing ? "exists" : "new";

    return {
      rowIndex: idx,
      id: row.id,
      assetTag: row.assetTag || "—",
      status,
      holder: row.holder || null,
      group: row.group || null,
      returnDate: row.returnDate || null,
      condition: row.condition || "Gut",
      issues,
      state,
    };
  });
}

function downloadTemplate() {
  const ws = XLSX.utils.json_to_sheet([
    { "iPad-ID": "iPad-009", "Asset-Tag": "SN-24-009", Status: "Verfügbar", Inhaber: "", Klasse: "", Rückgabedatum: "", Zustand: "Neuwertig" },
    { "iPad-ID": "iPad-010", "Asset-Tag": "SN-24-010", Status: "Verliehen", Inhaber: "Tom Fischer", Klasse: "8a", Rückgabedatum: "2026-08-01", Zustand: "Gut" },
  ]);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "iPads");
  XLSX.writeFile(wb, "ipad-import-vorlage.xlsx");
}

function BulkImportPanel({ ipads, setIpads, addActivity }) {
  const [rows, setRows] = useState([]);
  const [fileName, setFileName] = useState("");
  const [overwrite, setOverwrite] = useState(false);
  const [error, setError] = useState("");
  const [result, setResult] = useState(null);
  const fileInputRef = useRef(null);

  function handleFile(e) {
    const file = e.target.files?.[0];
    if (!file) return;
    setError("");
    setResult(null);
    setFileName(file.name);

    const reader = new FileReader();
    reader.onload = (evt) => {
      try {
        const data = new Uint8Array(evt.target.result);
        const workbook = XLSX.read(data, { type: "array" });
        const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
        const json = XLSX.utils.sheet_to_json(firstSheet, { defval: "" });
        if (json.length === 0) {
          setError("Die Tabelle enthält keine Zeilen.");
          setRows([]);
          return;
        }
        setRows(buildPreviewRows(json, ipads));
      } catch (err) {
        setError("Datei konnte nicht gelesen werden. Bitte eine gültige .xlsx- oder .csv-Datei hochladen.");
        setRows([]);
      }
    };
    reader.readAsArrayBuffer(file);
  }

  function reset() {
    setRows([]);
    setFileName("");
    setError("");
    setResult(null);
    if (fileInputRef.current) fileInputRef.current.value = "";
  }

  const importable = rows.filter((r) => r.state !== "error" && (r.state !== "exists" || overwrite));
  const skippedExisting = rows.filter((r) => r.state === "exists" && !overwrite).length;
  const erroredCount = rows.filter((r) => r.state === "error").length;

  function confirmImport() {
    let added = 0;
    let updated = 0;
    setIpads((prev) => {
      let next = [...prev];
      for (const row of importable) {
        const idx = next.findIndex((i) => i.id.toLowerCase() === row.id.toLowerCase());
        const entry = {
          id: row.id,
          assetTag: row.assetTag,
          status: row.status,
          holder: row.status === "lent" ? row.holder || "Unbekannt" : null,
          class: row.status === "lent" ? row.group || "—" : null,
          returnDate: row.status === "lent" ? row.returnDate || "—" : null,
          condition: row.condition,
        };
        if (idx >= 0) {
          next[idx] = entry;
          updated++;
        } else {
          next.push(entry);
          added++;
        }
      }
      return next;
    });
    addActivity(
      "import",
      `Massenimport: ${added} neue Geräte, ${updated} aktualisiert${skippedExisting ? `, ${skippedExisting} übersprungen` : ""}`
    );
    setResult({ added, updated, skipped: skippedExisting });
    setRows([]);
    setFileName("");
    if (fileInputRef.current) fileInputRef.current.value = "";
  }

  return (
    <div className="space-y-5">
      <div className="rounded-xl bg-indigo-50 ring-1 ring-indigo-200 p-4 flex flex-col sm:flex-row sm:items-center gap-3 sm:justify-between">
        <div className="flex items-start gap-3">
          <FileSpreadsheet size={20} className="text-indigo-600 shrink-0 mt-0.5" />
          <div>
            <p className="text-sm font-semibold text-indigo-900">Geräte per Excel-Tabelle importieren</p>
            <p className="text-xs text-indigo-700 mt-0.5">
              Spalten: iPad-ID, Asset-Tag, Status, Inhaber, Klasse, Rückgabedatum, Zustand. Status & Inhaber sind optional.
            </p>
          </div>
        </div>
        <button
          onClick={downloadTemplate}
          className="shrink-0 inline-flex items-center gap-1.5 rounded-lg bg-white ring-1 ring-indigo-200 text-indigo-700 text-xs font-semibold px-3 py-2 hover:bg-indigo-100 transition-colors whitespace-nowrap"
        >
          <Download size={14} /> Vorlage herunterladen
        </button>
      </div>

      {result ? (
        <div className="rounded-xl bg-emerald-50 ring-1 ring-emerald-200 text-emerald-800 px-4 py-4 text-sm space-y-2">
          <p className="flex items-center gap-2 font-semibold">
            <CheckCircle2 size={18} /> Import abgeschlossen
          </p>
          <p>
            {result.added} neue Geräte hinzugefügt, {result.updated} aktualisiert
            {result.skipped ? `, ${result.skipped} übersprungen (bereits vorhanden)` : ""}.
          </p>
          <button
            onClick={reset}
            className="inline-flex items-center gap-1.5 rounded-lg bg-white ring-1 ring-emerald-300 text-emerald-700 text-xs font-semibold px-3 py-2 hover:bg-emerald-100 transition-colors mt-1"
          >
            <RotateCcw size={14} /> Weitere Datei importieren
          </button>
        </div>
      ) : (
        <>
          <label className="flex flex-col items-center justify-center gap-2 rounded-2xl border-2 border-dashed border-slate-300 hover:border-indigo-400 hover:bg-indigo-50/40 transition-colors py-10 px-6 cursor-pointer text-center">
            <Upload size={26} className="text-slate-400" />
            <span className="text-sm font-semibold text-slate-700">
              {fileName ? fileName : "Excel-Datei auswählen oder hierher ziehen"}
            </span>
            <span className="text-xs text-slate-400">.xlsx, .xls oder .csv</span>
            <input ref={fileInputRef} type="file" accept=".xlsx,.xls,.csv" onChange={handleFile} className="hidden" />
          </label>

          {error && (
            <div className="rounded-xl bg-rose-50 ring-1 ring-rose-200 text-rose-700 px-4 py-3 text-sm flex items-center gap-2">
              <AlertTriangle size={17} /> {error}
            </div>
          )}

          {rows.length > 0 && (
            <div className="space-y-4">
              <div className="flex flex-wrap items-center justify-between gap-3">
                <div className="flex flex-wrap gap-2 text-xs">
                  <span className="rounded-full bg-emerald-50 ring-1 ring-emerald-200 text-emerald-700 px-2.5 py-1 font-medium">
                    {rows.filter((r) => r.state === "new").length} neu
                  </span>
                  <span className="rounded-full bg-amber-50 ring-1 ring-amber-200 text-amber-700 px-2.5 py-1 font-medium">
                    {rows.filter((r) => r.state === "exists").length} bereits vorhanden
                  </span>
                  {erroredCount > 0 && (
                    <span className="rounded-full bg-rose-50 ring-1 ring-rose-200 text-rose-700 px-2.5 py-1 font-medium">
                      {erroredCount} fehlerhaft
                    </span>
                  )}
                </div>
                <label className="flex items-center gap-2 text-xs font-medium text-slate-600 cursor-pointer">
                  <input type="checkbox" checked={overwrite} onChange={(e) => setOverwrite(e.target.checked)} className="rounded accent-indigo-600" />
                  Vorhandene Geräte überschreiben
                </label>
              </div>

              <div className="rounded-2xl ring-1 ring-slate-200 overflow-x-auto bg-white">
                <table className="w-full text-sm">
                  <thead className="bg-slate-50 text-slate-500 text-xs uppercase tracking-wide">
                    <tr>
                      <th className="text-left font-semibold px-4 py-2.5">iPad-ID</th>
                      <th className="text-left font-semibold px-4 py-2.5">Status</th>
                      <th className="text-left font-semibold px-4 py-2.5">Inhaber</th>
                      <th className="text-left font-semibold px-4 py-2.5">Zustand</th>
                      <th className="text-left font-semibold px-4 py-2.5">Ergebnis</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-100">
                    {rows.map((r) => (
                      <tr key={r.rowIndex} className={r.state === "error" ? "bg-rose-50/40" : ""}>
                        <td className="px-4 py-2.5 font-semibold text-slate-800">{r.id || "—"}</td>
                        <td className="px-4 py-2.5">{r.issues.length ? "—" : <StatusBadge status={r.status} />}</td>
                        <td className="px-4 py-2.5 text-slate-600">{r.holder ? `${r.holder}${r.group ? ` (${r.group})` : ""}` : "—"}</td>
                        <td className="px-4 py-2.5 text-slate-600">{r.condition}</td>
                        <td className="px-4 py-2.5">
                          {r.state === "error" ? (
                            <span className="text-rose-600 text-xs font-medium">{r.issues.join(", ")}</span>
                          ) : r.state === "exists" ? (
                            <span className="text-amber-600 text-xs font-medium">{overwrite ? "wird aktualisiert" : "wird übersprungen"}</span>
                          ) : (
                            <span className="text-emerald-600 text-xs font-medium">wird hinzugefügt</span>
                          )}
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>

              <div className="flex gap-3">
                <button
                  onClick={confirmImport}
                  disabled={importable.length === 0}
                  className="flex-1 rounded-xl bg-indigo-600 disabled:bg-slate-300 disabled:cursor-not-allowed hover:bg-indigo-700 text-white font-semibold py-3.5 transition-colors"
                >
                  {importable.length} Gerät{importable.length === 1 ? "" : "e"} importieren
                </button>
                <button
                  onClick={reset}
                  className="rounded-xl ring-1 ring-slate-300 text-slate-600 font-semibold px-5 py-3.5 hover:bg-slate-50 transition-colors"
                >
                  Abbrechen
                </button>
              </div>
            </div>
          )}
        </>
      )}
    </div>
  );
}

function AdminTickets({ tickets, setTickets }) {
  function advance(id) {
    setTickets((prev) =>
      prev.map((t) => {
        if (t.id !== id) return t;
        if (t.status === "open") return { ...t, status: "in-progress" };
        if (t.status === "in-progress") return { ...t, status: "resolved" };
        return t;
      })
    );
  }

  return (
    <div className="grid sm:grid-cols-3 gap-4">
      {TICKET_COLUMNS.map((col) => {
        const items = tickets.filter((t) => t.status === col.key);
        return (

              {items.length === 0 ? (
                <p className="text-xs text-slate-400 px-1">Keine Tickets hier.</p>

        );

function StudentTicketForm({ setTickets, addActivity }) {
  const [ipadId, setIpadId] = useState("");
  const [issue, setIssue] = useState("");
  const [sent, setSent] = useState(false);

  function submit(e) {
    e.preventDefault();
    if (!ipadId || !issue) return;
    setTickets((prev) => [
      { id: Date.now(), ipadId, reporter: "Du (simuliert)", issue, status: "open", date: "heute" },
      ...prev,
    ]);
    addActivity("ticket", `Neues Ticket: ${ipadId} · ${issue.slice(0, 40)}${issue.length > 40 ? "…" : ""}`);
    setSent(true);
    setIpadId("");
    setIssue("");
    setTimeout(() => setSent(false), 4000);
  }

  return (
    <div className="max-w-md mx-auto rounded-2xl bg-white ring-1 ring-slate-200 shadow-sm p-6">
      <div className="flex items-center gap-2 mb-1">
        <School size={18} className="text-indigo-600" />
        <p className="font-bold text-slate-900">Problem melden</p>
      </div>
      <p className="text-sm text-slate-500 mb-5">Simulierte Schüler- / Lehreransicht — landet direkt im Admin-Ticketsystem.</p>

      {sent && (
        <div className="rounded-xl bg-emerald-50 ring-1 ring-emerald-200 text-emerald-800 px-4 py-3 text-sm flex items-center gap-2 mb-4">
          <CheckCircle2 size={18} /> Danke! Dein Problem wurde gemeldet.
        </div>
      )}

      <form onSubmit={submit} className="space-y-4">
        <div>
          <label className="block text-sm font-semibold text-slate-700 mb-1.5">iPad-ID</label>
          <input
            value={ipadId}
            onChange={(e) => setIpadId(e.target.value)}
            placeholder="z.B. iPad-003"
            className="w-full rounded-xl border border-slate-300 px-4 py-3 text-base focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
          />
        </div>
        <div>
          <label className="block text-sm font-semibold text-slate-700 mb-1.5">Problem melden</label>
          <textarea
            value={issue}
            onChange={(e) => setIssue(e.target.value)}
            rows={4}
            placeholder="Was ist passiert?"
            className="w-full rounded-xl border border-slate-300 px-4 py-3 text-base focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 resize-none"
          />
        </div>
        <button
          type="submit"
          disabled={!ipadId || !issue}
          className="w-full rounded-xl bg-indigo-600 disabled:bg-slate-300 disabled:cursor-not-allowed hover:bg-indigo-700 text-white font-semibold py-3.5 transition-colors"
        >
          Melden
        </button>
      </form>
    </div>
  );
}

function Support({ tickets, setTickets, addActivity }) {
  const [view, setView] = useState("admin");

  return (
    <div className="space-y-5">
      <div className="flex items-center justify-between flex-wrap gap-3">
        <div>
          <h1 className="text-2xl font-bold text-slate-900">Support</h1>
          <p className="text-slate-500 text-sm mt-1">Tickets verwalten oder die Nutzeransicht testen.</p>
        </div>
        <div className="flex gap-2 rounded-xl bg-slate-100 p-1.5">
          <button
            onClick={() => setView("admin")}
            className={`rounded-lg px-4 py-2 text-sm font-semibold transition-colors ${
              view === "admin" ? "bg-white shadow-sm text-slate-900" : "text-slate-500 hover:text-slate-700"
            }`}
          >
            Admin-Ansicht
          </button>
          <button
            onClick={() => setView("student")}
            className={`rounded-lg px-4 py-2 text-sm font-semibold transition-colors ${
              view === "student" ? "bg-white shadow-sm text-slate-900" : "text-slate-500 hover:text-slate-700"
            }`}
          >
            Nutzeransicht (simuliert)
          </button>
        </div>
      </div>

      {view === "admin" ? (
        <AdminTickets tickets={tickets} setTickets={setTickets} />
      ) : (
        <StudentTicketForm setTickets={setTickets} addActivity={addActivity} />
      )}
    </div>
  );
}

/* ------------------------------------------------------------------ */
/* Communication hub                                                   */
/* ------------------------------------------------------------------ */

function Communication({ messages, setMessages, addActivity }) {
  const [recipientType, setRecipientType] = useState("class");
  const [recipient, setRecipient] = useState(CLASSES[0]);
  const [studentName, setStudentName] = useState(USERS[0].name);
  const [text, setText] = useState("");
  const [sent, setSent] = useState(false);

  function submit(e) {
    e.preventDefault();
    const target = recipientType === "class" ? recipient : studentName;
    if (!text.trim()) return;
    setMessages((prev) => [{ id: Date.now(), recipient: target, text, time: "gerade eben" }, ...prev]);
    addActivity("message", `Nachricht an ${target} gesendet`);
    setSent(true);
    setText("");
    setTimeout(() => setSent(false), 3000);
  }

  return (
    <div className="space-y-5">
      <div>
        <h1 className="text-2xl font-bold text-slate-900">Kommunikation</h1>
        <p className="text-slate-500 text-sm mt-1">Nachrichten an Klassen oder einzelne Personen senden.</p>
      </div>

      <div className="grid lg:grid-cols-5 gap-5">
        <div className="lg:col-span-2 rounded-2xl bg-white ring-1 ring-slate-200 shadow-sm p-5 sm:p-6 h-fit">
          <SectionTitle>Neue Nachricht</SectionTitle>

          {sent && (
            <div className="rounded-xl bg-emerald-50 ring-1 ring-emerald-200 text-emerald-800 px-4 py-3 text-sm flex items-center gap-2 mb-4">
              <CheckCircle2 size={18} /> Nachricht gesendet.
            </div>
          )}

          <form onSubmit={submit} className="space-y-4">
            <div className="flex gap-2 rounded-xl bg-slate-100 p-1.5">
              <button
                type="button"
                onClick={() => setRecipientType("class")}
                className={`flex-1 rounded-lg px-3 py-2 text-sm font-semibold transition-colors ${
                  recipientType === "class" ? "bg-white shadow-sm text-slate-900" : "text-slate-500"
                }`}
              >
                Ganze Klasse
              </button>
              <button
                type="button"
                onClick={() => setRecipientType("student")}
                className={`flex-1 rounded-lg px-3 py-2 text-sm font-semibold transition-colors ${
                  recipientType === "student" ? "bg-white shadow-sm text-slate-900" : "text-slate-500"
                }`}
              >
                Einzelperson
              </button>
            </div>

            {recipientType === "class" ? (
              <select
                value={recipient}
                onChange={(e) => setRecipient(e.target.value)}
                className="w-full rounded-xl border border-slate-300 px-4 py-3 text-base bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
              >
                {CLASSES.map((c) => (
                  <option key={c} value={c}>
                    {c}
                  </option>
                ))}
              </select>
            ) : (
              <select
                value={studentName}
                onChange={(e) => setStudentName(e.target.value)}
                className="w-full rounded-xl border border-slate-300 px-4 py-3 text-base bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
              >
                {USERS.map((u) => (
                  <option key={u.name} value={u.name}>
                    {u.name} ({u.group})
                  </option>
                ))}
              </select>
            )}

            <textarea
              value={text}
              onChange={(e) => setText(e.target.value)}
              rows={4}
              placeholder="Deine Nachricht…"
              className="w-full rounded-xl border border-slate-300 px-4 py-3 text-base focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 resize-none"
            />

            <button
              type="submit"
              disabled={!text.trim()}
              className="w-full rounded-xl bg-indigo-600 disabled:bg-slate-300 disabled:cursor-not-allowed hover:bg-indigo-700 text-white font-semibold py-3.5 transition-colors flex items-center justify-center gap-2"
            >
              <Send size={17} /> Senden
            </button>
          </form>
        </div>

        <div className="lg:col-span-3 rounded-2xl bg-white ring-1 ring-slate-200 shadow-sm p-5 sm:p-6">
          <SectionTitle sub="Simulierter Versandverlauf (Push / E-Mail)">Nachrichtenverlauf</SectionTitle>
          {messages.length === 0 ? (
            <EmptyState icon={MessageSquare} title="Noch keine Nachrichten" sub="Gesendete Nachrichten erscheinen hier." />
          ) : (
            <ul className="space-y-3">
              {messages.map((m) => (
                <li key={m.id} className="rounded-xl bg-slate-50 ring-1 ring-slate-100 p-4">
                  <div className="flex items-center justify-between mb-1">
                    <span className="text-sm font-semibold text-slate-800 flex items-center gap-1.5">
                      <Users size={14} className="text-indigo-500" /> {m.recipient}
                    </span>
                    <span className="text-xs text-slate-400 flex items-center gap-1">
                      <Clock size={12} /> {m.time}
                    </span>
                  </div>
                  <p className="text-sm text-slate-600">{m.text}</p>
                </li>
              ))}
            </ul>
          )}
        </div>
      </div>
    </div>
  );
}

/* ------------------------------------------------------------------ */
/* App shell / navigation                                              */
/* ------------------------------------------------------------------ */

const NAV = [
  { key: "dashboard", label: "Übersicht", icon: LayoutDashboard },
  { key: "lending", label: "Ausleihe", icon: ArrowLeftRight },
  { key: "support", label: "Support", icon: LifeBuoy },
  { key: "communication", label: "Kommunikation", icon: MessageSquare },
];

function App() {
  const [tab, setTab] = useState("dashboard");
  const [lendingMode, setLendingMode] = useState("checkout");
  const [ipads, setIpads] = useState(INITIAL_IPADS);
  const [tickets, setTickets] = useState(INITIAL_TICKETS);
  const [messages, setMessages] = useState(INITIAL_MESSAGES);
  const [activities, setActivities] = useState(INITIAL_ACTIVITIES);
  const [syncStatus, setSyncStatus] = useState(BACKEND_ENABLED ? "connecting" : "local");
  const loadedRef = useRef(!BACKEND_ENABLED);

  // Beim Start: bestehenden Stand aus Supabase laden (falls Backend konfiguriert)
  useEffect(() => {
    if (!BACKEND_ENABLED) return;
    (async () => {
      try {
        const remote = await loadRemoteState();
        if (remote) {
          setIpads(remote.ipads || INITIAL_IPADS);
          setTickets(remote.tickets || INITIAL_TICKETS);
          setMessages(remote.messages || INITIAL_MESSAGES);
          setActivities(remote.activities || INITIAL_ACTIVITIES);
        } else {
          // Noch kein Datensatz vorhanden -> mit den Startdaten anlegen
          await saveRemoteState({ ipads, tickets, messages, activities });
        }
        setSyncStatus("synced");
      } catch (e) {
        setSyncStatus("error");
      } finally {
        loadedRef.current = true;
      }
    })();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  // Bei jeder Änderung: automatisch (verzögert) in Supabase speichern
  useEffect(() => {
    if (!BACKEND_ENABLED || !loadedRef.current) return;
    setSyncStatus("saving");
    const timeout = setTimeout(async () => {
      try {
        await saveRemoteState({ ipads, tickets, messages, activities });
        setSyncStatus("synced");
      } catch (e) {
        setSyncStatus("error");
      }
    }, 800);
    return () => clearTimeout(timeout);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [ipads, tickets, messages, activities]);

  function addActivity(type, text) {
    setActivities((prev) => [{ id: Date.now(), type, text, time: "gerade eben" }, ...prev]);
  }

  function goTo(t, mode) {
    setTab(t);
    if (mode) setLendingMode(mode);
  }

  return (
    <div className="min-h-screen bg-slate-50 flex" style={{ fontFamily: "'Inter', ui-sans-serif, system-ui, sans-serif" }}>
      {/* Desktop sidebar */}
      <aside className="hidden md:flex w-60 shrink-0 flex-col bg-white border-r border-slate-200 p-4">
        <div className="flex items-center gap-2 px-2 py-3 mb-4">
          <div className="h-9 w-9 rounded-xl bg-indigo-600 flex items-center justify-center">
            <Tablet size={18} className="text-white" />
          </div>
          <div>
            <p className="font-bold text-slate-900 leading-tight">iPad Verwaltung</p>
            <p className="text-xs text-slate-400 leading-tight">Schulgeräte</p>
          </div>
        </div>
        <div className="px-2 mb-3">
          <SyncStatusBadge status={syncStatus} />
        </div>
        <nav className="space-y-1">
          {NAV.map((n) => (
            <button
              key={n.key}
              onClick={() => goTo(n.key)}
              className={`w-full flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-semibold transition-colors ${
                tab === n.key ? "bg-indigo-50 text-indigo-700" : "text-slate-500 hover:bg-slate-50 hover:text-slate-700"
              }`}
            >
              <n.icon size={18} />
              {n.label}
            </button>
          ))}
        </nav>
        <div className="mt-auto rounded-xl bg-slate-50 p-3 text-xs text-slate-400">
          MDM & technische Administration werden extern verwaltet. Dieses System deckt Ausleihe, Support und Kommunikation ab.
          {!BACKEND_ENABLED && (
            <p className="mt-1.5 text-amber-600">Kein Backend verbunden – Änderungen bleiben nur auf diesem Gerät gespeichert.</p>
          )}
        </div>
      </aside>

      {/* Main content */}
      <div className="flex-1 flex flex-col min-w-0">
        {/* Mobile header */}
        <header className="md:hidden sticky top-0 z-10 bg-white border-b border-slate-200 px-4 py-3 flex items-center justify-between gap-2">
          <div className="flex items-center gap-2">
            <div className="h-8 w-8 rounded-lg bg-indigo-600 flex items-center justify-center">
              <Tablet size={16} className="text-white" />
            </div>
            <p className="font-bold text-slate-900">iPad Verwaltung</p>
          </div>
          <SyncStatusBadge status={syncStatus} />
        </header>

        <main className="flex-1 p-4 sm:p-6 lg:p-8 max-w-5xl w-full mx-auto pb-24 md:pb-8">
          {tab === "dashboard" && <Dashboard ipads={ipads} tickets={tickets} activities={activities} goTo={goTo} />}
          {tab === "lending" && (
            <Lending ipads={ipads} setIpads={setIpads} addActivity={addActivity} initialMode={lendingMode} key={lendingMode} />
          )}
          {tab === "support" && <Support tickets={tickets} setTickets={setTickets} addActivity={addActivity} />}
          {tab === "communication" && <Communication messages={messages} setMessages={setMessages} addActivity={addActivity} />}
        </main>

        {/* Mobile bottom nav */}
        <nav className="md:hidden fixed bottom-0 inset-x-0 bg-white border-t border-slate-200 flex justify-around py-2 z-10">
          {NAV.map((n) => (
            <button
              key={n.key}
              onClick={() => goTo(n.key)}
              className={`flex flex-col items-center gap-0.5 px-3 py-1.5 rounded-lg text-xs font-medium transition-colors ${
                tab === n.key ? "text-indigo-600" : "text-slate-400"
              }`}
            >
              <n.icon size={20} />
              {n.label}
            </button>
          ))}
        </nav>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
